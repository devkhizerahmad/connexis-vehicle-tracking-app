# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# === PERFORMANCE (optimized for RN 0.87 + 4-core machine) ===

# JVM arguments — increased for native C++ compilation
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Parallel execution + build cache (BIGGEST speedup)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Configuration cache (fast configuration phase on subsequent builds)
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true

# === ANDROID / RN SETTINGS ===

# AndroidX
android.useAndroidX=true

# Build only for your Samsung device (fastest builds)
# Change to "armeabi-v7a,arm64-v8a,x86,x86_64" only when building release APK for others
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# New Architecture (Fabric + TurboModules)
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Edge-to-edge display
edgeToEdgeEnabled=true

# AGP 9 compatibility (keep these for now — RN libs still need them)
android.builtInKotlin=false
android.newDsl=false

# === API KEYS ===
